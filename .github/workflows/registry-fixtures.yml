name: Registry rehearsal fixtures
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: python3 -m unittest discover -s registry-fixtures -p 'test_*.py' -v
