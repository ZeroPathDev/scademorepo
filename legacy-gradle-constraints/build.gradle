plugins {
    id 'java-library'
}

allprojects {
    group = 'com.acme.commerce'
    version = '2026.05.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'

    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11

    dependencies {
        constraints {
            implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
            implementation 'com.google.guava:guava:32.1.2-jre'
            implementation 'io.github.resilience4j:resilience4j-retry:1.7.1'
            implementation 'io.micrometer:micrometer-core:1.11.5'
            implementation 'io.projectreactor:reactor-core:3.4.41'
            implementation 'org.apache.commons:commons-lang3:3.12.0'
            implementation 'org.apache.kafka:kafka-clients:3.6.1'
            implementation 'org.postgresql:postgresql:42.6.0'
            implementation 'org.springframework.security:spring-security-oauth2-jose:5.7.11'
            implementation 'org.springframework.security:spring-security-oauth2-resource-server:5.7.11'
            implementation 'org.springframework:spring-context:5.3.31'
            testImplementation 'junit:junit:4.13.2'
        }
    }
}
